name: CI & Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate JSON Datasets
        run: npm run validate

      - name: Execute Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build

      - name: Verify Sitemap & Assets Output
        run: test -f dist/sitemap.xml && test -f dist/index.html
